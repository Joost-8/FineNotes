name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Attest build provenance of plugin artifacts
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Extract release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # A beta (a tag with a "-", such as 1.0.2-beta.1) has no section of
          # its own: it ships what [Unreleased] lists.
          section="$TAG"
          case "$TAG" in *-*) section="Unreleased" ;; esac
          awk -v tag="$section" '
            $0 ~ "^## \\[" tag "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! [ -s release-notes.md ]; then
            echo "GoodObsidian $TAG. Install via Community Plugins or BRAT; manual install uses the three attached files." > release-notes.md
          fi
          cat release-notes.md

      - name: Create GitHub Release with plugin artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # A beta is a pre-release: never marked Latest on GitHub, installed
          # only by someone who picks it in BRAT. Obsidian's own updater reads
          # manifest.json on main, which a beta never touches.
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" $prerelease \
            --title "$TAG" \
            --notes-file release-notes.md \
            main.js manifest.json styles.css
