name: Issue helper probe

# A trial of the issue helper on past issues, run on pushes to its branch
# only: what the guide search, the similar-issue search and the form check
# would have said about each. No model (GitHub Models was retired on
# 2026-07-30). It writes to this run's summary and never comments on an
# issue. No issue text reaches a shell.

on:
  push:
    branches: [issue-helper]
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bundle the helper
        run: npx esbuild src/model/issue-helper.ts --bundle --platform=node --format=cjs --outfile="$RUNNER_TEMP/issue-helper.cjs"

      - name: Read past issues as if they were new
        uses: actions/github-script@v7
        env:
          HELPER: ${{ runner.temp }}/issue-helper.cjs
        with:
          script: |
            const helper = require(process.env.HELPER);
            const all = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo,
              state: "all",
              per_page: 100,
            });
            const issues = all.filter((i) => !i.pull_request).sort((a, b) => b.number - a.number);
            await core.summary.addHeading("Issue helper probe", 1).write();
            // The latest 25 issues, each against only what existed before it.
            for (const issue of issues.slice(0, 25)) {
              const input = { title: issue.title, body: issue.body ?? "" };
              const earlier = issues
                .filter((i) => i.number < issue.number)
                .map((i) => ({ number: i.number, title: i.title, closed: i.state === "closed" }));
              const text = helper.summaryMarkdown(
                issue.number,
                input,
                helper.guideMatches(input),
                helper.similarIssues(input, earlier),
                helper.missingDiagnostics(input),
              );
              await core.summary.addRaw(text).addRaw("\n").write();
            }
