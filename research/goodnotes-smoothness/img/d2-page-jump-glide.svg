<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">
  <rect width="760" height="320" fill="#ffffff"/>
  <text x="20" y="24" font-size="15" font-weight="600" fill="#111">Page jump (thumbnail tap, add page) — one fixed-length glide</text>

  <!-- axes: t 0..480 ms -> x 80..704 (1.3 px/ms); progress 0..1 -> y 260..60 -->
  <line x1="80" y1="260" x2="710" y2="260" stroke="#999"/>
  <line x1="80" y1="260" x2="80" y2="50" stroke="#999"/>
  <g fill="#666" text-anchor="middle">
    <text x="80" y="278">0</text><text x="210" y="278">100</text><text x="340" y="278">200</text>
    <text x="470" y="278">300</text><text x="600" y="278">400 ms</text>
  </g>
  <g fill="#666" text-anchor="end">
    <text x="72" y="264">0</text><text x="72" y="164">50%</text><text x="72" y="64">100%</text>
  </g>
  <line x1="80" y1="60" x2="710" y2="60" stroke="#eee"/>
  <line x1="80" y1="160" x2="710" y2="160" stroke="#eee"/>

  <!-- GoodObsidian today: instant (step) -->
  <path d="M80 260 L81 60 L710 60" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="90" y="52" fill="#dc2626">GoodObsidian today: thumbnail tap / Add page jump instantly</text>

  <!-- measured: 1-page jump, progress per frame (t from first moved frame) -->
  <polyline fill="none" stroke="#2563eb" stroke-width="2.5"
    points="80,260 101,252 123,234 145,216 166,199 188,183 209,169 231,156 253,144 275,133 296,122 317,114 339,106 361,99 382,92 405,87 426,81"/>
  <path d="M426 81 C520 64 590 61 642 60.4 L664 60" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="4 4"/>
  <g fill="#2563eb">
    <circle cx="101" cy="252" r="2.5"/><circle cx="123" cy="234" r="2.5"/><circle cx="145" cy="216" r="2.5"/>
    <circle cx="166" cy="199" r="2.5"/><circle cx="188" cy="183" r="2.5"/><circle cx="209" cy="169" r="2.5"/>
    <circle cx="231" cy="156" r="2.5"/><circle cx="253" cy="144" r="2.5"/><circle cx="275" cy="133" r="2.5"/>
    <circle cx="296" cy="122" r="2.5"/><circle cx="317" cy="114" r="2.5"/><circle cx="339" cy="106" r="2.5"/>
    <circle cx="361" cy="99" r="2.5"/><circle cx="382" cy="92" r="2.5"/><circle cx="405" cy="87" r="2.5"/>
    <circle cx="426" cy="81" r="2.5"/><circle cx="642" cy="60.4" r="2.5"/><circle cx="664" cy="60" r="2.5"/>
  </g>
  <text x="300" y="200" fill="#2563eb">GoodNotes, measured: ease-out, ≈450 ms total</text>
  <text x="300" y="216" fill="#2563eb">1 page (≈650 px) and 7 pages (≈4,900 px) take the SAME ≈450–470 ms</text>
  <text x="300" y="232" fill="#555">URL #page-N and the page counter update when the glide ends</text>
  <text x="20" y="300" fill="#777" font-size="11">Dots: measured page-top position per frame, normalised (dashed: frames not sampled, 266–432 ms).</text>
  <text x="20" y="314" fill="#777" font-size="11">Zoom is unchanged; long jumps scroll through every page in between.</text>
</svg>
