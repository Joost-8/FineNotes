<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">
  <rect width="760" height="300" fill="#ffffff"/>
  <text x="20" y="24" font-size="15" font-weight="600" fill="#111">Page counter and zoom % — measured in GoodNotes web (61 fps)</text>

  <!-- time axis: 0..3 s -> x 150..710 (186.7 px/s) -->
  <line x1="150" y1="262" x2="710" y2="262" stroke="#999"/>
  <g fill="#666" text-anchor="middle">
    <line x1="150" y1="258" x2="150" y2="266" stroke="#999"/><text x="150" y="280">0 s</text>
    <line x1="337" y1="258" x2="337" y2="266" stroke="#999"/><text x="337" y="280">1 s</text>
    <line x1="523" y1="258" x2="523" y2="266" stroke="#999"/><text x="523" y="280">2 s</text>
    <line x1="710" y1="258" x2="710" y2="266" stroke="#999"/><text x="710" y="280">3 s</text>
  </g>

  <!-- lane labels -->
  <g fill="#333" font-weight="600">
    <text x="20" y="70">Input</text>
    <text x="20" y="130">Page counter</text>
    <text x="20" y="215">Zoom %</text>
  </g>
  <text x="20" y="84" fill="#777">scroll / zoom / undo</text>
  <text x="20" y="144" fill="#777">opacity 0→1</text>
  <text x="20" y="229" fill="#777">opacity 0→1</text>

  <!-- input ticks 0..0.25 s -->
  <g stroke="#2563eb" stroke-width="2">
    <line x1="150" y1="58" x2="150" y2="78"/><line x1="160" y1="58" x2="160" y2="78"/>
    <line x1="170" y1="58" x2="170" y2="78"/><line x1="180" y1="58" x2="180" y2="78"/>
    <line x1="189" y1="58" x2="189" y2="78"/><line x1="197" y1="58" x2="197" y2="78"/>
  </g>
  <text x="206" y="73" fill="#2563eb">last input at 0.25 s</text>

  <!-- page counter opacity: 1 from 0 s, hold to 0.25+1.8 = 2.05 s (x=533), fade 0.5 s ease-out to 2.55 s (x=626) -->
  <line x1="150" y1="160" x2="150" y2="112" stroke="#0f766e" stroke-width="2.5"/>
  <path d="M150 112 L533 112 C533 112 587 160 626 160 L710 160" fill="none" stroke="#0f766e" stroke-width="2.5"/>
  <line x1="130" y1="160" x2="710" y2="160" stroke="#ddd"/>
  <!-- zoom pill: fade starts 200 ms later (x=570) ends x=663 -->
  <line x1="150" y1="245" x2="150" y2="197" stroke="#9333ea" stroke-width="2.5"/>
  <path d="M150 197 L570 197 C570 197 624 245 663 245 L710 245" fill="none" stroke="#9333ea" stroke-width="2.5"/>
  <line x1="130" y1="245" x2="710" y2="245" stroke="#ddd"/>

  <!-- annotations -->
  <text x="156" y="104" fill="#0f766e">appears instantly (no fade-in)</text>
  <line x1="197" y1="170" x2="533" y2="170" stroke="#0f766e" stroke-dasharray="3 3"/>
  <text x="300" y="185" fill="#0f766e">holds ≈1.8 s after the LAST input</text>
  <text x="540" y="104" fill="#0f766e">fade 0.5 s ease-out</text>
  <text x="572" y="190" fill="#9333ea">+200 ms later</text>
  <text x="20" y="298" fill="#777" font-size="11">Both pills: pointer-events none while hidden. Scroll thumb: same idea, gone ≈1 s after scrolling stops.</text>
</svg>
