<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">
  <rect width="760" height="260" fill="#ffffff"/>
  <text x="20" y="24" font-size="15" font-weight="600" fill="#111">Opening the page sidebar — three motions, measured per frame</text>

  <!-- t 0..400 ms -> x 230..710 (1.2 px/ms) -->
  <line x1="230" y1="206" x2="710" y2="206" stroke="#999"/>
  <g fill="#666" text-anchor="middle">
    <text x="230" y="224">0</text><text x="350" y="224">100</text><text x="470" y="224">200</text>
    <text x="590" y="224">300</text><text x="710" y="224">400 ms</text>
  </g>
  <line x1="470" y1="44" x2="470" y2="206" stroke="#eee"/>
  <line x1="590" y1="44" x2="590" y2="206" stroke="#eee"/>

  <g font-weight="600" fill="#333">
    <text x="20" y="70">Sidebar panel</text>
    <text x="20" y="120">Page (canvas content)</text>
    <text x="20" y="170">Floating tool bar</text>
  </g>
  <g fill="#777">
    <text x="20" y="84">translateX −412 → 0 px</text>
    <text x="20" y="134">slides right, SAME zoom</text>
    <text x="20" y="184">re-centres in what's left</text>
  </g>

  <rect x="230" y="60" width="240" height="22" rx="6" fill="#0f766e" opacity="0.85"/>
  <text x="240" y="75" fill="#fff">200 ms · CSS ease</text>
  <rect x="230" y="110" width="240" height="22" rx="6" fill="#2563eb" opacity="0.85"/>
  <text x="240" y="125" fill="#fff">≈200 ms · linear (≈16 px / frame)</text>
  <rect x="230" y="160" width="360" height="22" rx="6" fill="#9333ea" opacity="0.85"/>
  <text x="240" y="175" fill="#fff">300 ms · CSS ease</text>

  <text x="480" y="118" fill="#b45309">⚠ frame 1 twitches 19 px</text>
  <text x="480" y="132" fill="#b45309">the wrong way: don't copy</text>
  <text x="20" y="240" fill="#777" font-size="11">The canvas is not resized or re-fitted: the page is translated and may run off the right edge.</text>
  <text x="20" y="254" fill="#777" font-size="11">The panel stays mounted off-screen (translateX), so opening costs no layout.</text>
</svg>
