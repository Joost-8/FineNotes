<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">
  <rect width="760" height="210" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#555"/>
    </marker>
  </defs>
  <text x="20" y="24" font-size="15" font-weight="600" fill="#111">Text box: leaving it takes two taps, and the tool steps aside by itself</text>

  <rect x="20" y="70" width="150" height="64" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="95" y="96" text-anchor="middle" font-weight="600" fill="#111">Text tool</text>
  <text x="95" y="114" text-anchor="middle" fill="#555">tap on the page</text>

  <rect x="220" y="60" width="160" height="84" rx="10" fill="#eff6ff" stroke="#2563eb"/>
  <text x="300" y="86" text-anchor="middle" font-weight="600" fill="#111">Editing</text>
  <text x="300" y="104" text-anchor="middle" fill="#555">caret in box, box hugs text</text>
  <text x="300" y="120" text-anchor="middle" fill="#555">format bar (size, B/I, align…)</text>

  <rect x="430" y="60" width="160" height="84" rx="10" fill="#ecfdf5" stroke="#0f766e"/>
  <text x="510" y="86" text-anchor="middle" font-weight="600" fill="#111">Selected</text>
  <text x="510" y="104" text-anchor="middle" fill="#555">capsule width handles</text>
  <text x="510" y="120" text-anchor="middle" fill="#555">box menu (cut, delete…)</text>

  <rect x="640" y="70" width="100" height="64" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="690" y="100" text-anchor="middle" font-weight="600" fill="#111">Idle</text>
  <text x="690" y="118" text-anchor="middle" fill="#555">(lasso active)</text>

  <line x1="170" y1="102" x2="218" y2="102" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="380" y1="102" x2="428" y2="102" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="590" y1="102" x2="638" y2="102" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="404" y="158" text-anchor="middle" fill="#0f766e" font-weight="600">1st tap outside</text>
  <text x="614" y="158" text-anchor="middle" fill="#555" font-weight="600">2nd tap outside</text>
  <text x="194" y="158" text-anchor="middle" fill="#555">box created</text>

  <text x="20" y="190" fill="#777">After the box is placed the active tool switches to the lasso, so the next tap selects instead of making another box.</text>
</svg>
